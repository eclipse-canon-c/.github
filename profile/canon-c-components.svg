<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1ff5d6"/><stop offset="0.3" stop-color="#18c9ff"/><stop offset="0.55" stop-color="#7d5cff"/><stop offset="0.8" stop-color="#c74dff"/><stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#b52bd6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="40" y="54" fill="#1f2328" font-size="28" font-weight="700">Eclipse Canon-C Project</text>
  <text x="40" y="82" fill="#1f6feb" font-size="16">One verified base layer, and the work that grows around it</text>

  <!-- base layer: full width -->
  <rect x="40" y="108" width="880" height="118" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="64" y="146" fill="#1f6feb" font-size="19" font-weight="700">Canon-C</text>
  <text x="64" y="180" fill="#1f2328" font-size="15">The base layer: header-only C99 verified primitives</text>

  <!-- three tiles -->
  <g>
    <rect x="40" y="250" width="280" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="80" cy="282" r="17" fill="#e7f0ff" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="80" y="287" fill="#1f6feb" font-size="15" font-weight="700" text-anchor="middle">≡</text>
    <text x="106" y="288" fill="#1f6feb" font-size="15" font-weight="700">external-classifications</text>
    <text x="106" y="312" fill="#1f2328" font-size="12">Libraries built on the base layer,</text>
    <text x="106" y="330" fill="#1f2328" font-size="12">classified against Canon-C's</text>
    <text x="106" y="348" fill="#1f2328" font-size="12">canonical format: what an</text>
    <text x="106" y="366" fill="#1f2328" font-size="12">extension must provide, and</text>
    <text x="106" y="384" fill="#1f2328" font-size="12">where it sits.</text>
  </g>
  <g>
    <rect x="340" y="250" width="280" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="380" cy="282" r="17" fill="#e7f0ff" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="380" y="287" fill="#1f6feb" font-size="14" font-weight="700" text-anchor="middle">§</text>
    <text x="406" y="288" fill="#1f6feb" font-size="15" font-weight="700">academic-related</text>
    <text x="406" y="312" fill="#1f2328" font-size="12">Papers, preprints and their</text>
    <text x="406" y="330" fill="#1f2328" font-size="12">artifacts: the verification</text>
    <text x="406" y="348" fill="#1f2328" font-size="12">campaign, the argument budget,</text>
    <text x="406" y="366" fill="#1f2328" font-size="12">and the data a reviewer needs</text>
    <text x="406" y="384" fill="#1f2328" font-size="12">to reproduce them.</text>
  </g>
  <g>
    <rect x="640" y="250" width="280" height="150" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="680" cy="282" r="17" fill="#e7f0ff" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="680" y="287" fill="#1f6feb" font-size="11.5" font-weight="700" text-anchor="middle">www</text>
    <text x="706" y="288" fill="#1f6feb" font-size="15" font-weight="700">project-website</text>
    <text x="706" y="312" fill="#1f2328" font-size="12">eclipse.dev/canon-c — the</text>
    <text x="706" y="330" fill="#1f2328" font-size="12">project site: documentation,</text>
    <text x="706" y="348" fill="#1f2328" font-size="12">releases and how to get involved.</text>
  </g>
  <text x="40" y="440" fill="#57606a" font-size="12">Part of the Eclipse Foundation. .github and .eclipsefdn hold organisation configuration.</text>
</svg>
